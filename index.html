<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bathroom 360°</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "bathroom360.jpg.png",
    "autoLoad": true,
    "showControls": true
});
</script>

</body>
</html>
